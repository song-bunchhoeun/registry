name: Docker Publish

on:
  workflow_call:
    outputs:
      docker-image:
        description: "Docker image"
        value: ${{ jobs.build.outputs.docker-image }}
    inputs:
      REPOSITORY:
        description: "REPOSITORY"
        required: true
        type: string
      DOCKER_FILE:
        description: "DOCKER_FILE"
        required: true
        type: string

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      docker-image: ${{ steps.resolved.outputs.docker-image}}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ inputs.REPOSITORY }}
          tags: |
            type=raw,value={{branch}}-v{{date 'YYYYMMDD-HHmmss'}}-{{sha}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ inputs.DOCKER_FILE }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          provenance: false
          sbom: false

      - id: resolved
        name: "set docker image"
        run: |
          echo "docker-image=${{ steps.meta.outputs.tags }}" >> $GITHUB_OUTPUT
